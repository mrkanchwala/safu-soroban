[package]
name = "test-protection-pool"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Komet property-test contract. Excluded from the workspace; never shipped.
# Komet compiles the contracts named in kasmer.json (the harness and the mock
# token) and passes their Wasm hashes to `init`.

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
