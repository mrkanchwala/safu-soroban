[package]
name = "komet-mock-token"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Verification harness only. Excluded from the workspace; never shipped.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
