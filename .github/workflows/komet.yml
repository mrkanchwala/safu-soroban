# Komet (Runtime Verification) — MANUAL TRIGGER ONLY.
#
# Komet is a Soroban fuzzing + symbolic-verification tool built on the K
# framework, supported by the Stellar Foundation. It appears on the SCF Audit
# Bank intake form's list of accepted security tooling.
#
# WHAT KOMET ACTUALLY DOES (it is not a scanner)
# Komet runs property tests written as a SECOND contract that calls the one
# under test. `komet test` fuzzes those properties over many random inputs;
# `komet prove` symbolically executes them, establishing the property for ALL
# inputs rather than sampled ones. The properties live in
# `contracts/test-protection-pool`, and `kasmer.json` there names the contract
# to compile and deploy.
#
# WHY A GITHUB RUNNER
# The installer is a curl-pipe-to-bash pulling Nix and the full K/KWasm
# toolchain — real unaudited install surface that should not touch a
# workstation or a box running production. Runners are disposable, start
# clean, and are x86_64, which matches what the K toolchain ships.
#
# ---------------------------------------------------------------------------
# CORRECTIONS FROM PROBE RUN 33475575437 — all three were this file's bugs,
# and the first two were invisible because the third hid them.
#
#  1. `kup` is NOT at `$HOME/.kup/bin`. The K installer installs Nix, then
#     installs kup INTO THE NIX PROFILE. The right paths are
#     `~/.nix-profile/bin` and `/nix/var/nix/profiles/default/bin`.
#  2. Each GitHub step is a fresh shell, so `export PATH` does not carry.
#     Nix's own installer says as much: source
#     `/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh`. Anything
#     later steps need goes into `$GITHUB_PATH`.
#  3. `continue-on-error` plus `set +e` made a FAILED install report success.
#     The probe showed every step green while `komet: command not found` sat
#     in the log — precisely the false-green this repo's Scout workflow was
#     rewritten to avoid, reintroduced here. Installation is now verified by
#     running the binary, and the job FAILS if it is absent. A green tick must
#     mean the tool actually ran.
# ---------------------------------------------------------------------------

name: Komet (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  komet:
    name: Komet property tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Environment
        run: |
          uname -m
          df -h / | tail -1
          free -m | head -2

      - name: Install Nix + kup + Komet
        id: install
        run: |
          set -o pipefail
          echo "== K framework installer ==" | tee install.log
          echo "y" | bash <(curl -fsSL https://kframework.org/install) 2>&1 | tee -a install.log

          # Nix's own instruction — each step is a new shell, so this must be
          # sourced here AND the resulting paths exported to $GITHUB_PATH.
          if [ -f /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          fi
          export PATH="$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"

          echo "== locating kup ==" | tee -a install.log
          command -v kup | tee -a install.log || {
            echo "kup not on PATH; searching" | tee -a install.log
            ls -la "$HOME/.nix-profile/bin" 2>/dev/null | tee -a install.log
            ls -la /nix/var/nix/profiles/default/bin 2>/dev/null | tee -a install.log
          }

          echo "== kup install komet ==" | tee -a install.log
          kup install komet 2>&1 | tee -a install.log

          # Persist for later steps.
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      # Deliberately NOT continue-on-error. If komet is not runnable there is
      # nothing to report, and the job must say so rather than proceed green.
      - name: Verify Komet is actually runnable
        id: verify
        run: |
          set -o pipefail
          command -v komet | tee cli.log
          # NOTE: komet has no --version. It requires a subcommand and exits 2
          # without one:  usage: komet [-h] {run,kast,test,prove,prove-raw}
          # Probe run 33476201526 failed here on that flag alone, with the tool
          # installed and working. Use --help, which is the real surface.
          echo "== --help ==" | tee -a cli.log
          komet --help 2>&1 | tee -a cli.log
          echo "== test --help ==" | tee -a cli.log
          komet test --help 2>&1 | tee -a cli.log
          echo "== prove --help ==" | tee -a cli.log
          komet prove --help 2>&1 | tee -a cli.log

      # ONE-TIME DEPENDENCY TRACE — eng review 2026-09-01, priority action 1.
      #
      # Every failure in this workflow after the first was a missing external
      # binary found at RUNTIME, one run at a time: `stellar` (run 33481585123,
      # which then reported success while verifying nothing). Komet is readable
      # Python in the Nix store, so what it shells out to can simply be read.
      # Declaring the toolchain beats discovering it.
      #
      # Never allowed to fail the job -- it is diagnostics, not a gate.
      - name: Trace Komet's external dependencies
        continue-on-error: true
        run: |
          KOMET_BIN="$(command -v komet || true)"
          echo "komet: ${KOMET_BIN} -> $(readlink -f "${KOMET_BIN}" 2>/dev/null)"

          # Version, for citation. `komet` has no --version, so take it from the
          # Nix store path, which carries it.
          readlink -f "${KOMET_BIN}" 2>/dev/null \
            | grep -oE 'komet-[0-9]+\.[0-9]+\.[0-9]+' | head -1 > komet-version.txt || true
          echo "resolved version: $(cat komet-version.txt 2>/dev/null || echo unknown)"

          SRC="$(find /nix/store -maxdepth 6 -type d -path '*site-packages/komet' 2>/dev/null | head -1)"
          echo "sources: ${SRC:-<not found>}"
          if [ -n "$SRC" ]; then
            {
              echo "# binaries resolved via _which()"
              grep -rhoE "_which\('[^']+'\)" "$SRC" 2>/dev/null | sort -u
              echo "# subprocess invocations"
              grep -rhoE "run_process\(\[[^]]{0,120}" "$SRC" 2>/dev/null | sort -u
            } > komet-deps.txt
          else
            echo "(komet sources not located -- diagnostics only)" > komet-deps.txt
          fi
          cat komet-deps.txt

      # The test contract `contractimport!`s both harness Wasms, so they must
      # exist before it compiles. Komet also compiles them itself from
      # kasmer.json; building here first is what makes the import resolve.
      - name: Build harness contracts
        run: |
          set -o pipefail
          rustup target add wasm32v1-none
          cargo build --manifest-path contracts/komet-harness/Cargo.toml \
            --release --target wasm32v1-none 2>&1 | tail -3
          cargo build --manifest-path contracts/komet-mock-token/Cargo.toml \
            --release --target wasm32v1-none 2>&1 | tail -3
          ls -la contracts/komet-harness/target/wasm32v1-none/release/*.wasm
          ls -la contracts/komet-mock-token/target/wasm32v1-none/release/*.wasm

      # Guard: the harness must never change the artifact that ships. The
      # feature-flag approach was rejected precisely because it did.
      #
      # REWRITTEN after run 33478740264, where this step was the ONLY failure
      # and skipped the property tests entirely. It used to install stellar-cli
      # and rebuild the pool just to compare an optimised Wasm hash. Three
      # things were wrong with that:
      #
      #  1. It pinned `stellar-cli 23.1.4`, five majors behind current (28.0.0),
      #     which no longer compiles under the rust-toolchain.toml pin. It spent
      #     six minutes failing, `|| true` swallowed it, and the next line died
      #     with `stellar: command not found` (exit 127).
      #  2. The hash was hardcoded here, so every legitimate contract change —
      #     the T3 mainnet deploy included — silently turns this red.
      #  3. It was answering the question the expensive way. This workflow never
      #     consumes the production Wasm: kasmer.json names only komet-harness
      #     and komet-mock-token. The pool was built solely to be hashed.
      #
      # What we actually want to assert is that the harness did not touch the
      # production contract. git answers that directly, in milliseconds, with no
      # toolchain dependency and nothing to keep up to date. The structural half
      # of the guarantee — that the harness crates are excluded from the
      # workspace and so cannot reach the production build at all — is asserted
      # here too, because that exclusion is a load-bearing invariant that a
      # careless Cargo.toml edit could remove without any test noticing.
      - name: Assert the harness did not touch the production contract
        run: |
          set -o pipefail
          git diff --exit-code HEAD -- contracts/protection-pool \
            || { echo "::error::Harness build mutated contracts/protection-pool."; exit 1; }
          test -z "$(git status --porcelain contracts/protection-pool)" \
            || { echo "::error::Untracked files appeared under contracts/protection-pool."; exit 1; }
          grep -q 'exclude = .*komet-harness' Cargo.toml \
            || { echo "::error::Harness crates are no longer excluded from the workspace."; exit 1; }
          echo "untouched ✓"

      # Komet shells out to `stellar contract build` to compile the contracts
      # named in kasmer.json (komet/kasmer.py:156 -> _stellar_bin -> _which).
      # Without that binary `komet test` dies in under a second with
      #   RuntimeError: Couldn't find 'stellar' executable.
      # which is exactly what run 33481585123 did while reporting success.
      #
      # The earlier guard step happened to install stellar-cli as a side effect
      # of its hash rebuild, so removing that guard removed Komet's dependency
      # too. It is now installed explicitly, as its own step, because Komet
      # needs it -- not as a by-product of something else.
      #
      # Prebuilt binary first (seconds); build from crates.io only as a
      # fallback (minutes). The asset name is resolved from the release API
      # rather than hardcoded, so an upstream rename degrades to the fallback
      # instead of breaking the run. Whatever path is taken, the step FAILS if
      # `stellar` is not runnable afterwards. No `|| true` here, ever -- that is
      # what turned the original CLI failure into a confusing exit 127.
      - name: Install Stellar CLI (Komet shells out to it)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev libdbus-1-dev pkg-config

          URL=$(curl -fsSL https://api.github.com/repos/stellar/stellar-cli/releases/latest \
                | grep -oE '"browser_download_url": *"[^"]*x86_64-unknown-linux-gnu[^"]*\.tar\.gz"' \
                | head -1 | cut -d'"' -f4) || URL=""

          if [ -n "$URL" ]; then
            echo "prebuilt asset: $URL"
            curl -fsSL "$URL" -o /tmp/stellar.tar.gz
            tar -xzf /tmp/stellar.tar.gz -C /tmp
            BIN=$(find /tmp -maxdepth 3 -type f -name stellar | head -1)
            if [ -n "$BIN" ]; then
              sudo install -m 0755 "$BIN" /usr/local/bin/stellar
            fi
          fi

          if ! command -v stellar >/dev/null 2>&1; then
            echo "no usable prebuilt binary; building stellar-cli from crates.io"
            # 28.0.0 declares rust-version 1.93.0; rust-toolchain.toml pins
            # 1.96.0, so this compiles. The old 23.1.4 pin did not.
            cargo install --locked stellar-cli --version 28.0.0
          fi

          if ! command -v stellar >/dev/null 2>&1; then
            echo "::error::stellar CLI is not installed -- Komet cannot build the harness contracts."
            exit 1
          fi
          stellar --version

      # `-C <dir>` is the documented form; a bare `komet test` is not.
      - name: Run Komet property tests (fuzzing)
        id: test
        continue-on-error: true
        run: |
          set +e
          komet test -C contracts/test-protection-pool 2>&1 | tee komet-test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The prove subcommand takes `run`; `komet prove` alone is not valid.
      - name: Run Komet proofs (symbolic execution)
        id: prove
        continue-on-error: true
        run: |
          set +e
          komet prove run -C contracts/test-protection-pool 2>&1 | tee komet-prove.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Komet"
            echo ""
            echo "Tool version: \`$(cat komet-version.txt 2>/dev/null || echo unknown)\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "| Stage | Exit |"
            echo "|---|---|"
            echo "| \`komet test\` (fuzzing) | \`${{ steps.test.outputs.exit_code }}\` |"
            echo "| \`komet prove\` (symbolic) | \`${{ steps.prove.outputs.exit_code }}\` |"
            echo ""
            echo "### CLI"
            echo '```'
            head -40 cli.log 2>/dev/null || echo "(komet not runnable)"
            echo '```'
            echo ""
            echo "### test"
            echo '```'
            tail -40 komet-test.log 2>/dev/null || echo "(not run)"
            echo '```'
            echo ""
            echo "### prove"
            echo '```'
            tail -40 komet-prove.log 2>/dev/null || echo "(not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: komet-evidence
          path: |
            install.log
            cli.log
            komet-version.txt
            komet-deps.txt
            komet-test.log
            komet-prove.log
          if-no-files-found: warn

      # REWRITTEN after run 33481585123, which went GREEN while both Komet
      # invocations crashed in under a second. The previous version decided the
      # verdict by grepping the logs, and a Python traceback ending in
      # `RuntimeError: Couldn't find 'stellar' executable.` matched none of its
      # patterns -- so the job printed "properties checked -- results above are
      # real" over an empty result. That is the precise failure this workflow's
      # header says must never happen, reintroduced by the grep that was meant
      # to prevent a different false result.
      #
      # The exit code is now the authority. It cannot be evaded by wording, and
      # it does not need to anticipate what the next unknown blocker prints.
      # The log grep is kept only as a secondary check, for the case of a zero
      # exit with a hard error in the output.
      #
      # NOTE: a genuine property VIOLATION also lands here as a non-zero exit
      # and is reported as "no clean result". That is deliberate -- read the log
      # to tell a tool failure from a real finding. Both must stop the job; only
      # one of them is good news.
      - name: Verdict — did Komet actually verify anything?
        if: always()
        run: |
          TEST_EXIT="${{ steps.test.outputs.exit_code }}"
          PROVE_EXIT="${{ steps.prove.outputs.exit_code }}"
          echo "komet test  exit: ${TEST_EXIT:-<step never ran>}"
          echo "komet prove exit: ${PROVE_EXIT:-<step never ran>}"

          fail() {
            {
              echo ""
              echo "### Verdict: NOTHING VERIFIED"
              echo ""
              echo "$1"
              echo ""
              echo "Treat this as **no result**, not a pass — an absent finding is not"
              echo "a clean finding, and nothing here may be cited as one."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          [ -n "$TEST_EXIT" ]  || fail "The komet test step never ran."
          [ -n "$PROVE_EXIT" ] || fail "The komet prove step never ran."
          [ "$TEST_EXIT"  = "0" ] || fail "komet test exited ${TEST_EXIT} — no property was established."
          [ "$PROVE_EXIT" = "0" ] || fail "komet prove exited ${PROVE_EXIT} — no proof was established."
          [ -s komet-test.log ]  || fail "komet test produced no output."
          [ -s komet-prove.log ] || fail "komet prove produced no output."

          # Secondary: a zero exit with a traceback or hard error is still nothing.
          if grep -qiE "traceback \(most recent call last\)|^[A-Za-z_.]*error:|could not compile|command not found|no such file" \
               komet-test.log komet-prove.log 2>/dev/null; then
            fail "Exit code was 0 but the log carries a hard error."
          fi

          {
            echo ""
            echo "### Verdict: properties checked — results above are real"
            echo ""
            echo "\`komet test\` and \`komet prove\` both exited 0 with output."
          } >> "$GITHUB_STEP_SUMMARY"
