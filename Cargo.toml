[workspace]
resolver = "2"
members = ["contracts/protection-pool"]

# test-protection-pool is Komet's property-test contract. It is EXCLUDED from
# the workspace on purpose, not forgotten: it depends on Komet's own support
# crate, which the normal toolchain does not have, so making it a member would
# break `cargo test --workspace` and redden the CI badge that rust-toolchain.toml
# is pinned to protect. Komet compiles it separately via its own kasmer.json.
exclude = ["contracts/test-protection-pool", "contracts/komet-harness", "contracts/komet-mock-token"]

# Apache-2.0 chosen 2026-08-19 for SCF #44. The Build Award submission criteria
# require "a clear plan to open-source" any smart contracts; Apache-2.0 is
# OSI-approved, so the requirement is met outright rather than by argument.
# BUSL-1.1 (used by the non-SCF-funded EVM contracts) is source-available, NOT
# open source, and was deliberately not carried across. Both the LICENSE file
# and this field are needed: the file is what a reader sees, this field is what
# `cargo deny`, crates.io metadata, and the website's contract panel read.
[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
# Verified 2026-07-14 via `cargo check`: crates.io's actual latest is v27.0.0 (v22.0.0
# placeholder resolved to a real but 5-major-version-old v22.0.11 and pulled a stale API
# — pinning current so the code matches the SDK docs this was built against).
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
